name: Build & Release Brute-102

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS Universal (VST3 / AU / Standalone)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache JUCE FetchContent
        uses: actions/cache@v5
        with:
          path: .cache/juce
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt', 'juce/CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          if [ -f "juce/CMakeLists.txt" ]; then
            SRC_DIR="juce"
          elif [ -f "CMakeLists.txt" ]; then
            SRC_DIR="."
          else
            echo "::error::Could not find CMakeLists.txt in repository root or juce/"
            exit 1
          fi
          cmake -S "$SRC_DIR" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0" \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.cache/juce"

      - name: Build Brute-102
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

      - name: Package macOS release archive
        run: |
          mkdir -p release-assets Brute-102-macos-universal
          cp -Rp build/*_artefacts/Release/VST3/* Brute-102-macos-universal/
          cp -Rp build/*_artefacts/Release/AU/* Brute-102-macos-universal/
          cp -Rp build/*_artefacts/Release/Standalone/* Brute-102-macos-universal/
          ditto -c -k --sequesterRsrc --keepParent Brute-102-macos-universal release-assets/Brute-102-macos-universal.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brute-102-macos-universal
          path: release-assets/Brute-102-macos-universal.zip

  build-windows:
    name: Windows x64 (VST3 / Standalone)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache JUCE FetchContent
        uses: actions/cache@v5
        with:
          path: .cache/juce
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt', 'juce/CMakeLists.txt') }}

      - name: Configure CMake
        shell: pwsh
        run: |
          if (Test-Path "juce/CMakeLists.txt") {
            $srcDir = "juce"
          } elseif (Test-Path "CMakeLists.txt") {
            $srcDir = "."
          } else {
            Write-Error "Could not find CMakeLists.txt in repository root or juce/"
            exit 1
          }
          $juceCache = ($env:GITHUB_WORKSPACE -replace '\\', '/') + "/.cache/juce"
          cmake -S $srcDir -B build -A x64 -DFETCHCONTENT_BASE_DIR="$juceCache"

      - name: Build Brute-102
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package Windows release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets, Brute-102-windows-x64 | Out-Null
          Copy-Item -Recurse -Force build/*_artefacts/Release/VST3/* Brute-102-windows-x64/
          Copy-Item -Recurse -Force build/*_artefacts/Release/Standalone/* Brute-102-windows-x64/
          Compress-Archive -Path Brute-102-windows-x64 -DestinationPath release-assets/Brute-102-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brute-102-windows-x64
          path: release-assets/Brute-102-windows-x64.zip

  build-linux:
    name: Linux x86_64 (VST3 / Standalone)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Cache JUCE FetchContent
        uses: actions/cache@v5
        with:
          path: .cache/juce
          key: ${{ runner.os }}-juce-${{ hashFiles('CMakeLists.txt', 'juce/CMakeLists.txt') }}

      - name: Configure CMake
        run: |
          if [ -f "juce/CMakeLists.txt" ]; then
            SRC_DIR="juce"
          elif [ -f "CMakeLists.txt" ]; then
            SRC_DIR="."
          else
            echo "::error::Could not find CMakeLists.txt in repository root or juce/"
            exit 1
          fi
          cmake -S "$SRC_DIR" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/.cache/juce"

      - name: Build Brute-102
        run: cmake --build build --config Release --parallel "$(nproc)"

      - name: Package Linux release archive
        run: |
          mkdir -p release-assets Brute-102-linux-x86_64
          cp -a build/*_artefacts/Release/VST3/* Brute-102-linux-x86_64/
          cp -a build/*_artefacts/Release/Standalone/* Brute-102-linux-x86_64/
          tar -czf release-assets/Brute-102-linux-x86_64.tar.gz Brute-102-linux-x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: Brute-102-linux-x86_64
          path: release-assets/Brute-102-linux-x86_64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare versioned release assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-files
          mv artifacts/Brute-102-macos-universal.zip "release-files/Brute-102-${TAG}-macos-universal.zip"
          mv artifacts/Brute-102-windows-x64.zip "release-files/Brute-102-${TAG}-windows-x64.zip"
          mv artifacts/Brute-102-linux-x86_64.tar.gz "release-files/Brute-102-${TAG}-linux-x86_64.tar.gz"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --title "Brute-102 ${TAG}" \
              --generate-notes
          fi
